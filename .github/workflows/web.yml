name: Build & Publish Mikeka Web App

# Builds the web version of the Flutter app (same lib/main.dart as the APK).
#  1. Publishes it free on GitHub Pages:
#       https://skytanzania.github.io/MIKEKA-YANGU-APP/
#  2. Uploads a zip for cPanel (folder public_html/app → https://mikekaapp.co.tz/app/).
#     Hosting it on mikekaapp.co.tz means the browser needs no CORS for api.php.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Same Flutter version as the APK workflow.
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build for cPanel (mikekaapp.co.tz/app/)
        run: |
          flutter build web --release --base-href /app/ --no-source-maps
          cp .github/web-htaccess build/web/.htaccess
          cp .github/web-kill-sw.js build/web/flutter_service_worker.js
          # Pre-compressed copies: Apache serves the small .gz file when the
          # browser accepts gzip (main.dart.js ~2.5 MB -> ~0.7 MB).
          find build/web -type f \( -name '*.js' -o -name '*.json' -o -name '*.wasm' -o -name '*.html' -o -name '*.otf' -o -name '*.ttf' \) \
            -exec gzip -9 -k -f {} \;
          # Keep the cPanel files apart: the Pages build below reuses build/web.
          rm -rf cpanel-site && cp -r build/web cpanel-site

      # GitHub zips the artifact itself, so upload the files (not a zip):
      # the downloaded mikeka-web-cpanel.zip needs only ONE extract in cPanel.
      - name: Upload cPanel files
        uses: actions/upload-artifact@v4
        with:
          name: mikeka-web-cpanel
          path: cpanel-site/
          include-hidden-files: true   # keeps .htaccess
          if-no-files-found: error
          retention-days: 30

      - name: Build for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --base-href "/${REPO_NAME}/" --no-source-maps
          cp .github/web-kill-sw.js build/web/flutter_service_worker.js
          cp build/web/index.html build/web/404.html

      # One-time setup: Settings → Pages → Source: "GitHub Actions".
      # (A workflow is not allowed to switch Pages on by itself.)
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
