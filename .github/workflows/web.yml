name: Build & Publish Mikeka Web App

# Builds the web version of the Flutter app (same lib/main.dart as the APK).
#  1. Publishes it free on GitHub Pages:
#       https://skytanzania.github.io/MIKEKA-YANGU-APP/
#  2. Uploads a zip for cPanel (folder public_html/app → https://mikekaapp.co.tz/app/).
#     Hosting it on mikekaapp.co.tz means the browser needs no CORS for api.php.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Same Flutter version as the APK workflow.
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          cache: true

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build for cPanel (mikekaapp.co.tz/app/)
        run: |
          flutter build web --release --base-href /app/ --no-source-maps
          cp .github/web-htaccess build/web/.htaccess
          cp .github/web-kill-sw.js build/web/flutter_service_worker.js
          # No .gz copies in the download (Chrome flags zips full of archives);
          # the server compresses on the fly instead (.htaccess, mod_deflate).
          # Keep the cPanel files apart: the Pages build below reuses build/web.
          rm -rf cpanel-site && cp -r build/web cpanel-site

      # GitHub zips the artifact itself, so upload the files (not a zip):
      # the downloaded mikeka-web-cpanel.zip needs only ONE extract in cPanel.
      - name: Upload cPanel files
        uses: actions/upload-artifact@v4
        with:
          name: mikeka-web-cpanel
          path: cpanel-site/
          include-hidden-files: true   # keeps .htaccess
          if-no-files-found: error
          retention-days: 30

      # Automatic upload to cPanel — no download needed.
      # Add these repository secrets once (Settings → Secrets and variables → Actions):
      #   FTP_SERVER    e.g. ftp.mikekaapp.co.tz
      #   FTP_USERNAME  cPanel FTP user (cPanel → FTP Accounts)
      #   FTP_PASSWORD  its password
      #   FTP_SERVER_DIR (optional) folder from the FTP login, default public_html/app/
      - name: Check FTP secrets
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=cPanel auto-upload off::Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to upload the web app to mikekaapp.co.tz/app/ automatically."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to cPanel (mikekaapp.co.tz/app/)
        if: steps.ftp.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: cpanel-site/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/app/' }}
          dangerous-clean-slate: false

      - name: Build for GitHub Pages
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release --base-href "/${REPO_NAME}/" --no-source-maps
          cp .github/web-kill-sw.js build/web/flutter_service_worker.js
          cp build/web/index.html build/web/404.html

      # One-time setup: Settings → Pages → Source: "GitHub Actions".
      # (A workflow is not allowed to switch Pages on by itself.)
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
