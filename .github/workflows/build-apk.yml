name: Build Mikeka Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Flutter is pinned on purpose. The android/ folder in this repo is built for
      # Flutter 3.38.x (Gradle 8.14, AGP 8.11.1, Kotlin 2.2.20). Newer Flutter
      # releases use AGP 9, which the current notification/device-info plugin
      # versions do not support yet. Upgrade Flutter and the plugins together.
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikeka-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
