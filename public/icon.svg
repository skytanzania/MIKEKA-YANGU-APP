<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#002A24"/>
      <stop offset="60%" stop-color="#001018"/>
      <stop offset="100%" stop-color="#000010"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC8"/>
      <stop offset="100%" stop-color="#00B4FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00FFC8" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00FFC8" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="10 8"/>
  
  <!-- Central Icon: Betting / Sports / Trophy & Dice -->
  <g filter="url(#glow)">
    <!-- Main Diamond / Ticket Emblem -->
    <rect x="136" y="136" width="240" height="240" rx="44" fill="#0A0A1A" stroke="url(#neonGrad)" stroke-width="8" transform="rotate(45 256 256)"/>
    
    <!-- Inner Dice Spots / Crown Star -->
    <path d="M256 160 L280 230 L352 230 L294 274 L316 344 L256 300 L196 344 L218 274 L160 230 L232 230 Z" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
    
    <!-- Accent Dots -->
    <circle cx="256" cy="180" r="10" fill="#00FFC8"/>
    <circle cx="256" cy="332" r="10" fill="#00FFC8"/>
    <circle cx="180" cy="256" r="10" fill="#00FFC8"/>
    <circle cx="332" cy="256" r="10" fill="#00FFC8"/>
  </g>
  
  <!-- Branding Text -->
  <text x="256" y="420" font-family="Roboto, sans-serif" font-size="34" font-weight="900" fill="#00FFC8" letter-spacing="8" text-anchor="middle">
    MIKEKA
  </text>
  <text x="256" y="450" font-family="Roboto, sans-serif" font-size="16" font-weight="700" fill="#8899AA" letter-spacing="4" text-anchor="middle">
    APP TZ
  </text>
</svg>
